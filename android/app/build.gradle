plugins { id 'com.android.application' }
android {
    namespace 'io.github.dhbhojani12.pooldrive'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.dhbhojani12.pooldrive'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.0.' + (System.getenv('VERSION_CODE') ?: '1')
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KS_FILE') ?: 'none.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias 'pooldrive'
            keyPassword System.getenv('KS_PASS')
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
