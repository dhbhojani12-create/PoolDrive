<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PoolDrive</title>
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f6f6f8;--card:#fff;--text:#1b1b20;--muted:#6c6c78;--line:#e5e5ea;--hover:#f1f1f5;--accent:#4f46e5;--accent-soft:#eef0ff;--danger:#e5484d;--ok:#30a46c;--warn:#f5a524;--r:14px;--shadow:0 8px 30px rgba(20,20,40,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#111115;--card:#1a1a20;--text:#ececf1;--muted:#9b9ba8;--line:#2b2b33;--hover:#22222a;--accent:#7c74ff;--accent-soft:#25243c;--shadow:0 8px 30px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;white-space:nowrap}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.08)}
button.ghost{border-color:transparent;background:transparent}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#22b8cf);display:grid;place-items:center;color:#fff}
.space{flex:1;max-width:420px;margin-left:auto;cursor:pointer;padding:6px 10px;border-radius:10px}
.space:hover{background:var(--hover)}
.space-text{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.space-text b{color:var(--text)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:5px;display:flex}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .4s}
.bar.red>i{background:var(--danger)} .bar.amber>i{background:var(--warn)}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 20px;background:#fff6e5;color:#7a4b00;border-bottom:1px solid #f3dca8;font-size:14px}
@media (prefers-color-scheme:dark){.banner{background:#2f2410;color:#f5cf86;border-color:#4a3812}}
.banner button{padding:4px 10px;font-size:13px}
.acc-btn{position:relative}
.acc-btn.alert::after{content:"";position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--danger);border:2px solid var(--card)}

main{max-width:1100px;margin:0 auto;padding:16px 20px 120px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.crumbs{display:flex;align-items:center;flex-wrap:nowrap;gap:2px;font-size:17px;font-weight:600;min-width:0;flex:1 1 100%;overflow:hidden;min-height:36px}
.crumbs a{flex:0 0 auto;max-width:200px;padding:4px 8px;border-radius:8px;cursor:pointer;color:var(--muted);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a:hover{background:var(--hover);color:var(--text)}
.crumbs a.cur{flex:0 1 auto;min-width:40px;max-width:none;color:var(--text);cursor:default}
.crumbs a.cur:hover{background:transparent}
.crumbs .sep{flex:none;color:var(--muted)}
.crumbs .up{flex:none;width:34px;height:34px;padding:0;margin-right:6px;border-radius:50%;font-size:18px;line-height:1;display:grid;place-items:center}
.crumbs a.dots{letter-spacing:1px}
.search{position:relative;flex:1 1 260px;max-width:380px}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--card);outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.actions select{padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card)}

/* list */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.ic{flex:none;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.3px;color:#fff;background:var(--c)}
.ic.folder{background:transparent;color:#f4b400}
.nm{flex:1;min-width:0}
.nm .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.nm .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lock{font-size:12px;margin-left:4px}
.more{flex:none;border:0;background:transparent;padding:6px 8px;border-radius:8px;color:var(--muted);font-size:18px;line-height:1}
.more:hover{background:var(--line)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--text);margin:0 0 6px}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* drop overlay */
#drop{position:fixed;inset:0;z-index:60;background:rgba(79,70,229,.12);border:3px dashed var(--accent);display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--accent);backdrop-filter:blur(2px)}

/* upload panel */
.uploads{position:fixed;right:16px;bottom:16px;z-index:40;width:min(380px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.up-head{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:600;border-bottom:1px solid var(--line)}
.up-head span{flex:1}
.up-head .bar{margin:0;height:4px;border-radius:0;position:absolute;left:0;right:0;bottom:0}
.up-list{max-height:260px;overflow:auto}
.up-item{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:13.5px;border-bottom:1px solid var(--line)}
.up-item:last-child{border-bottom:0}
.up-item .nm .s{font-size:12px}
.st{flex:none;font-size:12px;color:var(--muted)}
.st.ok{color:var(--ok)} .st.err{color:var(--danger)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,10,20,.45);display:grid;place-items:center;padding:16px}
.sheet{background:var(--card);border-radius:18px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px}
.sheet.wide{width:min(1000px,100%);height:calc(100vh - 32px);display:flex;flex-direction:column;padding:0;overflow:hidden}
.sheet h2{margin:0 0 4px;font-size:20px}
.sheet .sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet-head .t{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv{flex:1;display:grid;place-items:center;overflow:auto;background:var(--bg)}
.pv img{max-width:100%;max-height:100%;object-fit:contain}
.pv iframe{width:100%;height:100%;border:0;background:#fff}
.pv pre{width:100%;height:100%;margin:0;padding:16px;white-space:pre-wrap;overflow:auto;font-size:13px}
.acc{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.acc img,.acc .av{width:40px;height:40px;border-radius:50%;flex:none;background:var(--accent-soft);display:grid;place-items:center;font-weight:700;color:var(--accent)}
.acc .nm .bar{margin-top:6px}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.chip.bad{background:#fde8e8;color:var(--danger)}
@media (prefers-color-scheme:dark){.chip.bad{background:#3a1a1c}}
.acc-btns{display:flex;flex-direction:column;gap:6px}
.acc-btns button{padding:5px 10px;font-size:13px}
.field{display:block;margin:14px 0}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none}
.field input:focus{border-color:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:14px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent)}
.check small{display:block;color:var(--muted)}
ol.steps{padding-left:20px;margin:0}
ol.steps li{margin:0 0 10px}
code,.code{background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:6px;font-size:13px;word-break:break-all}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:14px}
.info-row{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.info-row b{width:110px;flex:none;color:var(--muted);font-weight:500}
.info-row span{word-break:break-all}
.right{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* selection + move */
.row .sel{flex:none;width:18px;height:18px;margin:0;accent-color:var(--accent);cursor:pointer;opacity:.3;transition:opacity .15s}
.row:hover .sel,.row.selected .sel,.selecting .row .sel{opacity:1}
@media (pointer:coarse){.row .sel{opacity:1;width:20px;height:20px}}
.row.selected{background:var(--accent-soft)}
.row.drop-on{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.row.dragging{opacity:.45}
.crumbs a.drop-on{background:var(--accent-soft);color:var(--accent);outline:2px dashed var(--accent)}
.selbar{position:sticky;top:calc(var(--hh,64px) + 8px);z-index:15;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px 8px 16px;margin-bottom:10px;background:var(--accent);color:#fff;border-radius:12px;box-shadow:var(--shadow)}
.selbar span{flex:1;font-weight:600;min-width:90px}
.selbar button{background:rgba(255,255,255,.16);border-color:transparent;color:#fff;padding:6px 12px}
.selbar button:hover{background:rgba(255,255,255,.28)}
.picker-crumbs{font-size:15px;margin:6px 0 0}
.picker-list{border:1px solid var(--line);border-radius:12px;height:min(48vh,380px);overflow:auto;margin:10px 0 0}
.picker-list .row{padding:8px 12px}
.picker-list .ic.folder svg{width:28px;height:28px}

/* menu + toast */
.menu{position:fixed;z-index:55;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:200px}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:8px}
.menu button:hover{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1f1f26;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);max-width:90vw;animation:pop .2s}
.toast.err{background:var(--danger)}
@keyframes pop{from{transform:translateY(8px);opacity:0}}

@media (max-width:640px){
  .top{flex-wrap:wrap;padding:10px 14px;gap:8px}
  .space{order:3;flex-basis:100%;max-width:none;margin:0;padding:4px 0}
  #btnAccounts{margin-left:auto}
  main{padding:12px 12px 120px}
  .search{max-width:none;flex-basis:100%;order:2}
  .crumbs{order:1;font-size:16px}
  .crumbs a{max-width:120px}
  .actions{order:3;width:100%}
  .actions select{flex:1}
  .hide-sm{display:none}
}

/* ---------- full-width shell ---------- */
.top{display:none}
.shell{display:flex;min-height:100vh}
.side{flex:0 0 256px;box-sizing:border-box;background:var(--card);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{padding:0 6px}
.side-btns{display:flex;flex-direction:column;gap:8px}
.side-btns button{height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border:0;border-radius:10px;background:transparent;font-size:14px;text-align:left;width:100%;color:var(--text)}
.nav button:hover{background:var(--hover)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.storage{margin-top:auto;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.storage .head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
.storage .head button{padding:4px 10px;font-size:13px;color:var(--accent);font-weight:500}
.storage .big{font-size:22px;font-weight:700}
.storage .big small{font-size:13px;font-weight:400;color:var(--muted)}
.segbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.segbar>i{display:block;height:100%}
.acc-list{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.acc-row{display:flex;align-items:center;gap:8px}
.acc-row span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-row .f{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.content{flex:1;min-width:0}
main{max-width:none;margin:0;padding:24px 40px 120px}
.toolbar .search{max-width:640px;flex:1 1 360px;margin-left:0}
body[data-mode="analysis"] .vtoggle,body[data-mode="analysis"] .actions,body[data-mode="analysis"] #crumbs{display:none}
body[data-mode="recent"] .vtoggle,body[data-mode="recent"] #sort{display:none}
.vtoggle{display:flex;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:3px}
.vtoggle button{width:38px;height:32px;border:0;border-radius:8px;padding:0;display:grid;place-items:center;background:transparent;color:var(--muted)}
.vtoggle button.on{background:var(--accent-soft);color:var(--accent)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 12px}
.section-h h2{margin:0;font-size:15px;font-weight:600;color:var(--muted)}
.section-h span{font-size:13px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:24px}
.fcard{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card);cursor:pointer;user-select:none;min-width:0}
.fcard:hover{border-color:var(--accent)}
.fcard.selected{background:var(--accent-soft);border-color:var(--accent)}
.fcard.drop-on{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.fcard.dragging{opacity:.45}
.fcard .tr{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.fcard .tr .r{display:flex;align-items:center;gap:6px}
.fcard .ic.folder{width:auto;height:auto}
.fcard .ic.folder svg{width:42px;height:42px}
.fcard .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .s{font-size:12.5px;color:var(--muted)}
.fcard .more{position:absolute;right:8px;bottom:8px}
.fcard .sel{width:18px;height:18px;margin:0;accent-color:var(--accent);opacity:.3}
.fcard:hover .sel,.fcard.selected .sel,.selecting .fcard .sel{opacity:1}
@media (pointer:coarse){.fcard .sel{opacity:1}}
.lockchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:#8a5a00;background:#fff4d6;padding:3px 8px;border-radius:99px}
@media (prefers-color-scheme:dark){.lockchip{background:#3a2c0a;color:#f5cf86}}
.mobile-top,.mnav,.fab,#mNewFolder{display:none}
/* analysis */
.ana-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:18px}
.ana-head h1{margin:0;font-size:24px}
.ana-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--card)}
.typebar{height:14px;border-radius:99px;overflow:hidden;display:flex;background:var(--line);margin:12px 0}
.typebar>i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:13px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.atabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.atab{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border-radius:14px;text-align:left;border:1px solid var(--line);background:var(--card)}
.atab b{font-size:22px}
.atab small{font-size:12.5px;color:var(--muted)}
.atab span{font-size:13px;font-weight:600}
.atab.on{border:2px solid var(--accent);background:var(--accent-soft)}
.atab.zero:not(.on) b{color:var(--muted)}
.atab.on span{color:var(--accent)}
.apanel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.apanel-h h2{margin:0;font-size:16px}
.apanel-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.btn-danger{background:#fde8e8;color:#b42323;border-color:transparent;font-weight:600}
@media (prefers-color-scheme:dark){.btn-danger{background:#3a1a1c;color:#ff9b9b}}
.arow{display:grid;grid-template-columns:24px minmax(0,3fr) minmax(0,2.4fr) minmax(0,1.1fr);gap:16px;align-items:center;padding:11px 20px;border-bottom:1px solid var(--line);font-size:14px}
.arow:last-child{border-bottom:0}
.arow input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.arow .nmx{display:flex;align-items:center;gap:12px;min-width:0}
.arow .nmx a{color:var(--text);text-decoration:none;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.arow .nmx a:hover{color:var(--accent)}
.arow .path{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sizebar{display:flex;flex-direction:column;gap:5px}
.sizebar b{font-weight:600}
.sizebar i{display:block;height:4px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.sizebar i>i{background:var(--accent)}
.dgroup{padding:14px 20px;border-bottom:1px solid var(--line)}
.dgroup:last-child{border-bottom:0}
.dgroup .h{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.dgroup .h .n{flex:1 1 240px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dgroup .h .m{font-size:13px;color:var(--muted)}
.dgroup .places{display:flex;flex-direction:column;gap:4px;padding:8px 0 0 48px;font-size:13px;color:var(--muted)}
.dgroup .places b{color:var(--ok);font-weight:600}
.ana-note{font-size:12.5px;color:var(--muted);margin-top:12px}
.progress{padding:50px 20px;text-align:center;color:var(--muted)}

@media (max-width:760px){
  .side{display:none}
  .mobile-top{display:flex;flex-direction:column;gap:10px;background:var(--card);border-bottom:1px solid var(--line);padding:14px 14px 12px;position:sticky;top:0;z-index:20}
  .mobile-top .row1{display:flex;align-items:center;gap:10px}
  .mobile-top .row1 .brand{flex:1}
  .mobile-top .st{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
  .mobile-top .st b{color:var(--text)}
  .mnav{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 0}
  .mnav button{flex:none;border-radius:99px;padding:7px 14px;font-size:13.5px}
  .mnav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  main{padding:12px 12px 120px}
  .toolbar .search{flex-basis:100%;max-width:none;order:2;margin:0}
  .crumbs{order:1}
  .vtoggle{order:3}
  .actions{order:4;flex:1}
  #mNewFolder{display:inline-flex}

<script>
/* ============================================================
   PoolDrive: several Google Drive accounts used as one drive.
   Everything runs in the browser. Sign-in tokens stay on this
   device (localStorage) and go only to Google.
   ============================================================ */

// Optional: paste your OAuth Client ID here so you never see the setup screen.
const HARDCODED_CLIENT_ID = '';

const SCOPE  = 'https://www.googleapis.com/auth/drive';
const FOLDER = 'application/vnd.google-apps.folder';
const API    = 'https://www.googleapis.com/drive/v3/';
const UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
const FIELDS = 'id,name,mimeType,size,modifiedTime,webViewLink,parents,appProperties';
const isLockedF = f => f?.appProperties?.pooldriveLocked === '1';
const MARGIN = 5 * 1024 * 1024;           // keep 5 MB spare in every account
const PARALLEL = 3;                        // uploads at the same time
const LS = { cfg: 'pooldrive.cfg.v1', acc: 'pooldrive.accounts.v1' };

const $ = s => document.querySelector(s);
const load  = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

let cfg = Object.assign({ clientId: '', keepTogether: true, sort: 'name' }, load(LS.cfg, {}));
if (HARDCODED_CLIENT_ID) cfg.clientId = HARDCODED_CLIENT_ID;
let accounts = load(LS.acc, []);   // {email,name,photo,token,exp,limit,usage}
const saveCfg = () => store(LS.cfg, cfg);
const saveAcc = () => store(LS.acc, accounts);

const escH = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const escQ = s => String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
const qs = o => new URLSearchParams(o).toString();
function fmt(b) {
  if (b === Infinity) return 'Unlimited';
  if (b == null || isNaN(b)) return '—';
  const u = ['B','KB','MB','GB','TB']; let i = 0; b = +b;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (i ? b.toFixed(b < 10 ? 1 : 0) : b) + ' ' + u[i];
}
const fmtDate = d => d ? new Date(d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const isLive = a => !!a && !!a.token && a.exp > Date.now() + 30000;
const live = () => accounts.filter(isLive);
const accBy = e => accounts.find(a => a.email === e);
const freeOf = a => a.limit ? Math.max(0, a.limit - a.usage) : Infinity;
const isTouch = matchMedia('(pointer:coarse)').matches;

class AuthErr extends Error { constructor(a) { super('Sign-in expired for ' + (a?.email || 'an account')); this.acc = a; } }

/* ---------------- Google API ---------------- */
async function api(a, path, opts = {}, retry = true) {
  if (!isLive(a) && !(await silentRefresh(a))) throw new AuthErr(a);
  const r = await fetch(path.startsWith('http') ? path : API + path, {
    ...opts, headers: { Authorization: 'Bearer ' + a.token, ...(opts.headers || {}) }
  });
  if (r.status === 401) { a.exp = 0; saveAcc(); if (retry && await silentRefresh(a)) return api(a, path, opts, false); updateBanner(); throw new AuthErr(a); }
  if (!r.ok) {
    let m = 'Error ' + r.status;
    try { const j = await r.json(); m = j.error?.message || m; } catch {}
    throw new Error(m);
  }
  if (opts.raw) return r;
  return r.status === 204 ? null : r.json();
}
const jsonOpts = (method, body) => ({ method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

function gisReady() {
  if (window.google?.accounts?.oauth2) return Promise.resolve();
  return new Promise((res, rej) => {
    let n = 0;
    const t = setInterval(() => {
      if (window.google?.accounts?.oauth2) { clearInterval(t); res(); }
      else if (++n > 80) { clearInterval(t); rej(new Error('Google sign-in could not load. Check your internet connection.')); }
    }, 100);
  });
}

async function getToken(hint, prompt) {
  if (!cfg.clientId) { showSetup(); throw new Error('Add your Client ID first'); }
  await gisReady();
  return new Promise((res, rej) => {
    const tc = google.accounts.oauth2.initTokenClient({
      client_id: cfg.clientId, scope: SCOPE, prompt, hint, login_hint: hint,
      callback: r => {
        if (r.error) return rej(new Error(r.error_description || r.error));
        if (!google.accounts.oauth2.hasGrantedAllScopes(r, SCOPE))
          return rej(new Error('Please tick the "See, edit, create and delete your Google Drive files" box'));
        res(r);
      },
      error_callback: e => rej(new Error(e.type === 'popup_closed' ? 'Sign-in window was closed'
        : e.type === 'popup_failed_to_open' ? 'Pop-up blocked. Allow pop-ups for this site.' : (e.message || e.type)))
    });
    tc.requestAccessToken({ prompt, hint, login_hint: hint });
  });
}

/* ---------------- Stay signed in ----------------
   Your own Google Apps Script (cfg.authUrl) keeps the client secret. Sign-in then gives a long-term
   key (a.rt) and fresh 1-hour sign-ins are fetched silently, here and in PDF Pair (same site). */
const AUTH_CODE = "/**\n * PoolDrive \"Stay signed in\" helper.\n * Runs in YOUR Google account (script.google.com). It keeps the OAuth client secret here,\n * so the secret is never in GitHub or on your devices. PoolDrive and PDF Pair send it a\n * one-time sign-in code (first time) or a long-term key (later) and get a fresh sign-in back.\n *\n * Setup: Project Settings \u2192 Script properties \u2192 add\n *   CLIENT_ID     = your PoolDrive Client ID (\u2026apps.googleusercontent.com)\n *   CLIENT_SECRET = that client's secret (Google Cloud \u2192 Google Auth Platform \u2192 Clients \u2192 PoolDrive)\n * Then Deploy \u2192 New deployment \u2192 Web app \u2192 Execute as: Me \u00b7 Who has access: Anyone \u2192 Deploy,\n * and paste the Web app URL into PoolDrive \u2192 Accounts \u2192 Stay signed in.\n */\nfunction doPost(e) {\n  var p = {};\n  try { p = JSON.parse((e && e.postData && e.postData.contents) || '{}'); } catch (err) { return out({ error: 'bad_request' }); }\n  var props = PropertiesService.getScriptProperties();\n  var id = props.getProperty('CLIENT_ID'), secret = props.getProperty('CLIENT_SECRET');\n  if (!id || !secret) return out({ error: 'not_set_up', error_description: 'Add CLIENT_ID and CLIENT_SECRET in Project Settings \u2192 Script properties.' });\n  var payload = { client_id: id, client_secret: secret };\n  if (p.op === 'code' && p.code) { payload.code = p.code; payload.grant_type = 'authorization_code'; payload.redirect_uri = 'postmessage'; }\n  else if (p.op === 'refresh' && p.refresh_token) { payload.refresh_token = p.refresh_token; payload.grant_type = 'refresh_token'; }\n  else return out({ error: 'bad_request' });\n  var r = UrlFetchApp.fetch('https://oauth2.googleapis.com/token', { method: 'post', payload: payload, muteHttpExceptions: true });\n  var j = {};\n  try { j = JSON.parse(r.getContentText()); } catch (err) { j = { error: 'google_error' }; }\n  // only pass back what the apps need\n  return out(j.error ? { error: j.error, error_description: j.error_description || '' }\n    : { access_token: j.access_token, expires_in: j.expires_in, refresh_token: j.refresh_token || null, scope: j.scope || '' });\n}\nfunction doGet() { return out({ ok: true, app: 'PoolDrive stay signed in', ready: !!PropertiesService.getScriptProperties().getProperty('CLIENT_SECRET') }); }\nfunction out(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }\n";
const authOn = () => !!cfg.authUrl;
async function authCall(body) {
  const r = await fetch(cfg.authUrl, { method: 'POST', body: JSON.stringify(body) });
  let j; try { j = await r.json(); } catch { throw new Error('The "stay signed in" helper did not answer. Check its URL.'); }
  if (j.error) throw new Error(j.error_description || j.error);
  return j;
}
async function getCode(hint) {
  await gisReady();
  return new Promise((res, rej) => {
    google.accounts.oauth2.initCodeClient({
      client_id: cfg.clientId, scope: SCOPE, ux_mode: 'popup', hint, login_hint: hint, select_account: !hint,
      callback: r => {
        if (r.error) return rej(new Error(r.error_description || r.error));
        if (!google.accounts.oauth2.hasGrantedAllScopes(r, SCOPE)) return rej(new Error('Please tick the "See, edit, create and delete your Google Drive files" box'));
        res(r.code);
      },
      error_callback: e => rej(new Error(e.type === 'popup_closed' ? 'Sign-in window was closed' : e.type === 'popup_failed_to_open' ? 'Pop-up blocked. Allow pop-ups for this site.' : (e.message || e.type)))
    }).requestCode();
  });
}
// one sign-in: with the helper → also a long-term key; without → the 1-hour sign-in as before
async function signIn(hint, prompt) {
  if (!authOn()) return getToken(hint, prompt);
  return authCall({ op: 'code', code: await getCode(hint) });
}
const refreshing = new Map();
function silentRefresh(a) {
  if (!authOn() || !a || !a.rt) return Promise.resolve(false);
  if (refreshing.has(a.email)) return refreshing.get(a.email);
  const p = (async () => {
    try {
      const j = await authCall({ op: 'refresh', refresh_token: a.rt });
      a.token = j.access_token; a.exp = Date.now() + j.expires_in * 1000; if (j.refresh_token) a.rt = j.refresh_token;
      saveAcc(); return true;
    } catch (e) { if (/invalid_grant/i.test(e.message)) { a.rt = null; saveAcc(); } return false; }
    finally { refreshing.delete(a.email); }
  })();
  refreshing.set(a.email, p); return p;
}
async function refreshAll() {
  const due = accounts.filter(a => a.rt && a.exp < Date.now() + 5 * 60e3);
  if (!due.length) return false;
  return (await Promise.all(due.map(silentRefresh))).some(Boolean);
}
// PDF Pair (same site) may refresh too: take its newer sign-ins
addEventListener('storage', e => {
  if (e.key !== LS.acc) return;
  for (const f of load(LS.acc, [])) { const a = accBy(f.email); if (a && f.exp > a.exp) { a.token = f.token; a.exp = f.exp; if (f.rt) a.rt = f.rt; } }
  renderSpace(); updateBanner();
});

async function refreshAbout(a) {
  const r = await api(a, 'about?fields=' + encodeURIComponent('user(displayName,emailAddress,photoLink),storageQuota(limit,usage)'));
  a.email = r.user.emailAddress; a.name = r.user.displayName; a.photo = r.user.photoLink || '';
  a.limit = r.storageQuota.limit ? +r.storageQuota.limit : 0;
  a.usage = +r.storageQuota.usage || 0;
  return a;
}

async function addAccount() {
  try {
    const r = await signIn(undefined, 'select_account consent');
    const t = { token: r.access_token, exp: Date.now() + r.expires_in * 1000 };
    if (r.refresh_token) t.rt = r.refresh_token;
    await refreshAbout(t);
    const ex = accBy(t.email);
    if (authOn() && !t.rt && !(ex && ex.rt)) toast('Google gave no long-term key for ' + t.email + '. Remove PoolDrive at myaccount.google.com/permissions (that account), then add it again.', true);
    if (ex) { Object.assign(ex, t); toast('Reconnected ' + t.email); }
    else { accounts.push(t); toast('Added ' + t.email); }
    saveAcc(); accountsChanged();
  } catch (e) { toast(e.message, true); }
}

async function reconnect(a) {
  try {
    const r = await signIn(a.email, '');
    const t = { token: r.access_token, exp: Date.now() + r.expires_in * 1000 };
    if (r.refresh_token) t.rt = r.refresh_token;
    else if (authOn() && !a.rt) toast('Google gave no long-term key for ' + a.email + '. Remove PoolDrive at myaccount.google.com/permissions (that account), then tap "Stay signed in" again.', true);
    await refreshAbout(t);
    if (t.email !== a.email) {
      const other = accBy(t.email);
      if (other) Object.assign(other, t); else accounts.push(t);
      saveAcc(); accountsChanged();
      return toast(`You picked ${t.email}. Tap Reconnect again and choose ${a.email}.`, true);
    }
    Object.assign(a, t); saveAcc(); accountsChanged();
  } catch (e) { toast(e.message, true); }
}

// Browsers allow one sign-in pop-up per click, so this walks through the accounts:
// first tap reconnects account 1, then a "Next" button appears for each remaining one.
let reconnectLater = false;   // "Later" pressed: don't pop the box again until the page is reloaded
function showReconnectBox() {
  const rest = accounts.filter(a => !isLive(a));
  if (!rest.length) { if ($('#modal').dataset.view === 'reconnect') closeModal(); return; }
  const total = accounts.length, ok = total - rest.length;
  showModal(`<h2>Reconnect accounts</h2>
    <p class="sub">${ok} of ${total} connected. Files in the other ${rest.length === 1 ? 'account are' : rest.length + ' accounts are'} hidden until you reconnect. Your browser needs one tap per account.</p>
    ${rest.map((a, i) => `<div class="info-row"><b>${i === 0 ? 'Next' : 'Then'}</b><span>${escH(a.email)}</span></div>`).join('')}
    <div class="right"><button id="rcLater">Later</button><button class="primary" id="rcNext">Reconnect ${escH(rest[0].email)}</button></div>`, 'reconnect');
  $('#rcNext').onclick = reconnectAll;
  $('#rcLater').onclick = () => { reconnectLater = true; closeModal(); };
}
async function reconnectAll() {
  const dead = accounts.filter(a => !isLive(a));
  if (!dead.length) { if ($('#modal').dataset.view === 'reconnect') closeModal(); return toast('All accounts are connected'); }
  await reconnect(dead[0]);
  if (!accounts.some(a => !isLive(a))) { if ($('#modal').dataset.view === 'reconnect') closeModal(); return toast('All accounts reconnected ✓'); }
  showReconnectBox();
}

function removeAccount(a) {
  if (!confirm(`Remove ${a.email} from PoolDrive?\n\nNothing is deleted from Google Drive; its files just stop showing here.`)) return;
  try { if (a.token) google.accounts.oauth2.revoke(a.token, () => {}); } catch {}
  accounts = accounts.filter(x => x !== a); saveAcc(); accountsChanged();
}

function accountsChanged() {
  // an account came back or was added since the last scan: scan again so Analysis covers it
  if (scan && live().some(a => !scan.scanned.includes(a.email))) scan = null;
  fcache.clear(); renderSpace(); updateBanner();
  if ($('#modal').dataset.view === 'accounts') showAccounts();
  reload();
}

/* ---------------- Merged folders ---------------- */
// A location is a merged folder: {name, refs:[{email,id}]}. Root = refs null (My Drive of every account).
let stack = [{ name: 'All files', refs: null }];
const curNames = () => stack.slice(1).map(s => s.name);
const locRefs = loc => loc.refs
  ? loc.refs.filter(r => isLive(accBy(r.email)))
  : live().map(a => ({ email: a.email, id: 'root' }));

// folder id cache per account + path, so uploads reuse (or create) the right folders
const fcache = new Map();
const fkey = (email, names) => email + '::' + names.join('/');
function seed(email, names, id) { const k = fkey(email, names); if (!fcache.has(k)) fcache.set(k, Promise.resolve(id)); }
function ensureFolderPath(a, names) {
  if (!names.length) return Promise.resolve('root');
  const k = fkey(a.email, names);
  if (fcache.has(k)) return fcache.get(k);
  const p = (async () => {
    const parent = await ensureFolderPath(a, names.slice(0, -1));
    const name = names[names.length - 1];
    const r = await api(a, 'files?' + qs({ q: `name='${escQ(name)}' and '${parent}' in parents and mimeType='${FOLDER}' and trashed=false`, fields: 'files(id)', pageSize: 1 }));
    if (r.files.length) return r.files[0].id;
    const c = await api(a, 'files?fields=id', jsonOpts('POST', { name, mimeType: FOLDER, parents: [parent] }));
    return c.id;
  })();
  fcache.set(k, p);
  p.catch(() => fcache.delete(k));
  return p;
}

async function listChildren(a, id) {
  const out = []; let tok;
  do {
    const p = { q: `'${id}' in parents and trashed=false`, fields: `nextPageToken,files(${FIELDS})`, pageSize: 1000 };
    if (tok) p.pageToken = tok;
    const r = await api(a, 'files?' + qs(p));
    out.push(...r.files); tok = r.nextPageToken;
  } while (tok);
  return out;
}

function merge(groups) {
  const folders = new Map(), files = [];
  for (const { email, items } of groups) for (const f of items) {
    if (f.mimeType === FOLDER) {
      let e = folders.get(f.name);
      if (!e) { e = { kind: 'folder', name: f.name, refs: [], modifiedTime: f.modifiedTime }; folders.set(f.name, e); }
      e.refs.push({ email, id: f.id });
      if (isLockedF(f)) e.locked = true;
      if ((f.modifiedTime || '') > (e.modifiedTime || '')) e.modifiedTime = f.modifiedTime;
    } else files.push({ kind: 'file', ...f, email });
  }
  return [...folders.values(), ...files];
}

/* ---------------- Loading & search ---------------- */
let items = [], view = [], loadSeq = 0, loading = false, searchQ = '';

let mode = 'files';   // files | recent | locked | analysis
function setMode(m) {
  if (m === 'trash') return trashMenu();
  mode = m;
  if (m !== 'files') clearSearch();
  document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === mode));
  reload(); window.scrollTo(0, 0);
}
function trashMenu() {
  const live_ = accounts;
  if (live_.length === 1) return window.open('https://drive.google.com/drive/trash?authuser=' + encodeURIComponent(live_[0].email), '_blank', 'noopener');
  const m = $('#menu');
  m.innerHTML = '<div style="padding:6px 12px;font-size:12.5px;color:var(--muted)">Open Google Drive Trash for:</div>' +
    live_.map(a => `<button data-tr="${escH(a.email)}">${escH(a.email)}</button>`).join('');
  m.classList.remove('hidden');
  const r = document.querySelector('.nav [data-nav="trash"]').getBoundingClientRect();
  m.style.left = (r.right + 6) + 'px'; m.style.top = Math.max(8, Math.min(r.top, innerHeight - m.offsetHeight - 8)) + 'px';
  m.onclick = e => { const b = e.target.closest('[data-tr]'); if (!b) return; closeMenu(); window.open('https://drive.google.com/drive/trash?authuser=' + encodeURIComponent(b.dataset.tr), '_blank', 'noopener'); };
}

async function loadRecent() {
  const seq = ++loadSeq; loading = true; renderList();
  const res = await Promise.allSettled(live().map(async a => {
    const r = await api(a, 'files?' + qs({ q: `trashed=false and mimeType!='${FOLDER}' and 'me' in owners`, orderBy: 'modifiedTime desc', fields: `files(${FIELDS})`, pageSize: 50 }));
    return r.files.map(f => ({ kind: 'file', ...f, email: a.email, fromSearch: true }));
  }));
  if (seq !== loadSeq) return;
  items = res.filter(x => x.status === 'fulfilled').flatMap(x => x.value)
    .sort((a, b) => (b.modifiedTime || '').localeCompare(a.modifiedTime || '')).slice(0, 80);
  loading = false; renderList();
}
async function loadLocked() {
  const seq = ++loadSeq; loading = true; renderList();
  const res = await Promise.allSettled(live().map(async a => {
    const r = await api(a, 'files?' + qs({ q: `appProperties has { key='pooldriveLocked' and value='1' } and trashed=false`, fields: `files(${FIELDS})`, pageSize: 200 }));
    return r.files.map(f => ({ kind: 'folder', name: f.name, refs: [{ email: a.email, id: f.id }], modifiedTime: f.modifiedTime, fromSearch: true, email: a.email, id: f.id, parents: f.parents, locked: true }));
  }));
  if (seq !== loadSeq) return;
  const byName = new Map();          // same-name locked folders in several accounts = one card
  res.filter(x => x.status === 'fulfilled').flatMap(x => x.value).forEach(f => {
    const e = byName.get(f.name); if (e) e.refs.push(...f.refs); else byName.set(f.name, f);
  });
  items = [...byName.values()];
  loading = false; renderList();
}

async function reload() {
  selected.clear();
  document.body.dataset.mode = searchQ ? 'files' : mode;
  renderCrumbs();
  if (!cfg.clientId) return renderList();
  if (!accounts.length) { items = []; return renderList(); }
  if (mode === 'analysis') return renderAnalysis();
  if (mode === 'recent' && !searchQ) return loadRecent();
  if (mode === 'locked' && !searchQ) return loadLocked();
  if (searchQ) return doSearch();
  const seq = ++loadSeq;
  const refs = locRefs(stack[stack.length - 1]);
  const names = curNames();
  refs.forEach(r => seed(r.email, names, r.id));
  loading = true; renderList();
  const res = await Promise.allSettled(refs.map(async r => ({ email: r.email, items: await listChildren(accBy(r.email), r.id) })));
  if (seq !== loadSeq) return;
  res.forEach(x => { if (x.status === 'rejected' && !(x.reason instanceof AuthErr)) toast(x.reason.message, true); });
  items = merge(res.filter(x => x.status === 'fulfilled').map(x => x.value));
  loading = false; renderList();
}

async function doSearch() {
  const seq = ++loadSeq; loading = true; renderList();
  const q = searchQ;
  const res = await Promise.allSettled(live().map(async a => {
    const r = await api(a, 'files?' + qs({ q: `name contains '${escQ(q)}' and trashed=false`, fields: `files(${FIELDS})`, pageSize: 200 }));
    return { email: a.email, items: r.files };
  }));
  if (seq !== loadSeq) return;
  items = [];
  res.forEach(x => {
    if (x.status !== 'fulfilled') return;
    for (const f of x.value.items) items.push(f.mimeType === FOLDER
      ? { kind: 'folder', name: f.name, refs: [{ email: x.value.email, id: f.id }], modifiedTime: f.modifiedTime, fromSearch: true, email: x.value.email, id: f.id, parents: f.parents, locked: isLockedF(f) }
      : { kind: 'file', ...f, email: x.value.email, fromSearch: true });
  });
  loading = false; renderList();
}

function clearSearch() { searchQ = ''; $('#search').value = ''; }

// Path of a folder inside its account's My Drive, as folder names.
async function pathOf(a, id) {
  const names = []; let cur = id;
  for (let i = 0; i < 40; i++) {
    const f = await api(a, `files/${cur}?fields=name,parents`);
    if (!f.parents || !f.parents.length) break;   // reached My Drive
    names.unshift(f.name); cur = f.parents[0];
  }
  return names;
}
// Walk the merged tree by names so the folder shows its content from every account.
// Build the merged folder path (same-name folders in every account) for these names.
async function mergedStack(names) {
  const st = [{ name: 'All files', refs: null }];
  for (const n of names) {
    const refs = locRefs(st[st.length - 1]); const found = [];
    await Promise.allSettled(refs.map(async r => {
      const q = await api(accBy(r.email), 'files?' + qs({ q: `name='${escQ(n)}' and '${r.id}' in parents and mimeType='${FOLDER}' and trashed=false`, fields: 'files(id,appProperties)' }));
      q.files.forEach(f => found.push({ email: r.email, id: f.id, locked: isLockedF(f) }));
    }));
    if (!found.length) break;
    st.push({ name: n, refs: found.map(({ email, id }) => ({ email, id })), locked: found.some(f => f.locked) });
  }
  return st;
}
function toFilesMode() {
  clearSearch();
  if (mode !== 'files') { mode = 'files'; document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === 'files')); }
}
async function navigateNames(names) {
  toFilesMode(); stack = [stack[0]];
  loading = true; renderCrumbs(); renderList();          // instant feedback while the path is looked up
  stack = await mergedStack(names);
  loading = false; reload();
}
// Open a folder found by the Analysis scan: show it straight away from what the scan knows,
// then quietly add the same-name folders from the other accounts.
function openScannedFolder(f) {
  const levels = [...(f.pathChain || []), { name: f.name, id: f.id, locked: !!f.locked }];
  toFilesMode();
  stack = [{ name: 'All files', refs: null }, ...levels.map(l => ({ name: l.name, refs: [{ email: f.email, id: l.id }], locked: !!l.locked }))];
  const fast = stack;
  reload(); window.scrollTo(0, 0);
  mergedStack(levels.map(l => l.name)).then(st => {
    if (stack !== fast || mode !== 'files' || searchQ) return;            // user moved on: leave it
    if (st.length === fast.length && st.some((x, i) => i && (x.refs.length > fast[i].refs.length || x.locked !== fast[i].locked))) { stack = st; reload(); }
  }).catch(() => {});
}
async function goToLocation(it) {
  const a = accBy(it.email);
  try {
    const target = it.kind === 'folder' ? it.id : (it.parents || [])[0];
    if (!target) throw new Error('No folder');
    const names = await pathOf(a, target);
    await navigateNames(names);
  } catch (e) {
    if (it.kind === 'folder') { clearSearch(); mode = 'files'; document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === 'files')); stack = [stack[0], { name: it.name, refs: it.refs, locked: !!it.locked }]; reload(); }
    else toast('This file is not inside your My Drive folders (it may be shared with you).', true);
  }
}

/* ---------------- Rendering ---------------- */
function typeOf(f) {
  if (f.kind === 'folder') return ['folder', '', ''];
  const m = f.mimeType || '', ext = (f.name.includes('.') ? f.name.split('.').pop() : '').toLowerCase();
  if (m === 'application/pdf') return ['pdf', 'PDF', '#e5484d'];
  if (m.startsWith('image/')) return ['image', 'IMG', '#30a46c'];
  if (m.startsWith('video/')) return ['video', 'VID', '#8e4ec6'];
  if (m.startsWith('audio/')) return ['audio', 'AUD', '#d6409f'];
  if (m === 'application/vnd.google-apps.document' || /^docx?$/.test(ext)) return ['doc', 'DOC', '#3e63dd'];
  if (m === 'application/vnd.google-apps.spreadsheet' || /^(xlsx?|csv)$/.test(ext)) return ['sheet', 'XLS', '#18794e'];
  if (m === 'application/vnd.google-apps.presentation' || /^pptx?$/.test(ext)) return ['slides', 'PPT', '#f76b15'];
  if (/^(zip|rar|7z|tar|gz)$/.test(ext)) return ['zip', 'ZIP', '#6f6e77'];
  if (m.startsWith('text/') || /^(json|md|js|html|css)$/.test(ext)) return ['text', 'TXT', '#6f6e77'];
  if (m.startsWith('application/vnd.google-apps.')) return ['gapp', 'G', '#4285f4'];
  return ['file', (ext || 'FILE').slice(0, 4).toUpperCase(), '#8b8d98'];
}
const FOLDER_SVG = '<svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg>';

function renderCrumbs() {
  const c = $('#crumbs');
  const titles = { recent: 'Recent', locked: 'Locked folders', analysis: 'Analysis' };
  if (!searchQ && titles[mode]) { c.innerHTML = `<a class="cur">${titles[mode]}</a>`; return; }
  if (searchQ) { c.innerHTML = `<button class="up" data-c="clear" title="Back to folders">←</button><a data-c="clear">All files</a><span class="sep">›</span><a class="cur">Search: “${escH(searchQ)}”</a>`; return; }
  const last = stack.length - 1;
  // long paths: All files › … › parent › current
  const idx = stack.length > 3 ? [0, 'more', last - 1, last] : stack.map((_, i) => i);
  const up = last > 0 ? `<button class="up" data-c="${last - 1}" title="Up to ${escH(stack[last - 1].name)}">←</button>` : '';
  c.innerHTML = up + idx.map(i => i === 'more'
    ? `<a class="dots" data-cm="1" title="${escH(stack.slice(1, last - 1).map(s => s.name).join(' › '))}">…</a>`
    : `<a ${i === last ? 'class="cur"' : `data-c="${i}"`} title="${escH(stack[i].name)}">${escH(stack[i].name)}</a>`
  ).join('<span class="sep">›</span>');
}
function crumbMenu(anchor) {
  const m = $('#menu'), last = stack.length - 1;
  m.innerHTML = stack.slice(1, last - 1).map((s, k) => `<button data-c="${k + 1}" style="padding-left:${12 + k * 12}px">📁 ${escH(s.name)}</button>`).join('');
  m.classList.remove('hidden');
  const r = anchor.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + 'px';
  m.style.top = (r.bottom + 4) + 'px';
  m.onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; closeMenu(); stack = stack.slice(0, +b.dataset.c + 1); reload(); };
}

function sortedItems() {
  const s = mode === 'recent' && !searchQ ? 'modified' : cfg.sort;
  return [...items].sort((a, b) => {
    if (a.kind !== b.kind) return a.kind === 'folder' ? -1 : 1;
    if (s === 'modified') return (b.modifiedTime || '').localeCompare(a.modifiedTime || '');
    if (s === 'size') return (+b.size || 0) - (+a.size || 0);
    return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
  });
}

function renderList() {
  const el = $('#list');
  if (!cfg.clientId) {
    el.innerHTML = `<div class="list empty"><h3>One-time setup needed</h3><p>PoolDrive needs a Google Client ID before it can sign in.</p><button class="primary" onclick="showSetup()">Open setup</button></div>`; return;
  }
  if (!accounts.length) {
    el.innerHTML = `<div class="list empty"><h3>Add your first Google account</h3><p>Add every Google account you want to pool. Their free space is combined into one drive.</p><button class="primary" onclick="addAccount()">+ Add Google account</button></div>`; return;
  }
  if (loading) { el.innerHTML = '<div class="list"><div class="spinner"></div></div>'; return; }
  if (mode === 'analysis' && !searchQ) return renderAnalysis();
  view = sortedItems();
  if (!view.length) {
    const msg = searchQ ? `<h3>No matches</h3><p>Nothing named “${escH(searchQ)}” in any connected account.</p>`
      : mode === 'recent' ? '<h3>Nothing yet</h3><p>Files you add or change show up here.</p>'
      : mode === 'locked' ? '<h3>No locked folders</h3><p>Lock a folder from its ⋯ menu to protect it from being deleted.</p>'
      : '<h3>This folder is empty</h3><p>Drop files here or tap Upload.</p>';
    el.innerHTML = `<div class="list empty">${msg}</div>`; return;
  }
  const drag = !isTouch;
  const rowOf = (it, i) => {
    const [t, label, color] = typeOf(it);
    const icon = t === 'folder' ? `<span class="ic folder">${FOLDER_SVG}</span>` : `<span class="ic" style="--c:${color}">${label}</span>`;
    const meta = it.kind === 'folder'
      ? ['Folder', fmtDate(it.modifiedTime)].filter(Boolean).join(' · ')
      : [it.size ? fmt(+it.size) : (it.mimeType || '').startsWith('application/vnd.google-apps.') ? 'Google file' : '', fmtDate(it.modifiedTime)].filter(Boolean).join(' · ');
    const on = selected.has(ikey(it));
    return `<div class="row${on ? ' selected' : ''}" data-i="${i}"${drag ? ' draggable="true"' : ''}><input type="checkbox" class="sel" data-sel="${i}" ${on ? 'checked' : ''} title="Select">${icon}<div class="nm"><div class="t">${escH(it.name)}${it.locked ? ' <span title="Locked" class="lock">🔒</span>' : ''}</div><div class="s">${escH(meta)}</div></div><button class="more" data-more="${i}" title="More">⋯</button></div>`;
  };
  const cardOf = (it, i) => {
    const on = selected.has(ikey(it));
    const meta = ['Folder', fmtDate(it.modifiedTime)].filter(Boolean).join(' · ');
    return `<div class="fcard${on ? ' selected' : ''}" data-i="${i}"${drag ? ' draggable="true"' : ''}>
      <div class="tr"><span class="ic folder">${FOLDER_SVG}</span><span class="r">${it.locked ? '<span class="lockchip">🔒 Locked</span>' : ''}<input type="checkbox" class="sel" data-sel="${i}" ${on ? 'checked' : ''} aria-label="Select ${escH(it.name)}"></span></div>
      <div><div class="t" title="${escH(it.name)}">${escH(it.name)}</div><div class="s">${escH(meta)}</div></div>
      <button class="more" data-more="${i}" aria-label="More actions">⋯</button></div>`;
  };
  const sel = selected.size ? ' selecting' : '';
  if (cfg.view === 'list') {
    el.innerHTML = `<div class="list${sel}">` + view.map(rowOf).join('') + '</div>';
  } else {
    const fi = [], fl = [];
    view.forEach((it, i) => (it.kind === 'folder' ? fi : fl).push([it, i]));
    el.innerHTML =
      (fi.length ? `<div class="section-h"><h2>Folders</h2><span>${fi.length} folder${fi.length > 1 ? 's' : ''}</span></div><div class="fgrid${sel}">${fi.map(([it, i]) => cardOf(it, i)).join('')}</div>` : '') +
      (fl.length ? `<div class="section-h"><h2>Files</h2><span>${fl.length} file${fl.length > 1 ? 's' : ''}</span></div><div class="list${sel}">${fl.map(([it, i]) => rowOf(it, i)).join('')}</div>` : '');
  }
  renderSelbar();
}

/* ---------------- Selection ---------------- */
const selected = new Map();   // key -> item
const ikey = it => it.kind === 'folder' ? 'd:' + it.refs.map(r => r.email + '/' + r.id).join(',') : 'f:' + it.email + '/' + it.id;
function toggleSel(it) { const k = ikey(it); selected.has(k) ? selected.delete(k) : selected.set(k, it); renderList(); }
function clearSel() { selected.clear(); renderList(); }
function renderSelbar() {
  const b = $('#selbar');
  if (!selected.size) { b.classList.add('hidden'); return; }
  b.classList.remove('hidden');
  b.innerHTML = `<span>${selected.size} selected</span>
    ${selected.size < view.length ? '<button data-sa="all">Select all</button>' : ''}
    <button data-sa="move">Move to…</button><button data-sa="trash">Trash</button><button data-sa="clear" title="Clear selection">✕</button>`;
}
$('#selbar').addEventListener('click', e => {
  const a = e.target.closest('[data-sa]')?.dataset.sa; if (!a) return;
  const its = [...selected.values()];
  if (a === 'all') { view.forEach(it => selected.set(ikey(it), it)); renderList(); }
  else if (a === 'move') showMovePicker(its);
  else if (a === 'trash') deleteItems(its);
  else clearSel();
});

/* ---------------- Move ---------------- */
const rootIds = new Map();
async function rootIdOf(a) {
  if (!rootIds.has(a.email)) rootIds.set(a.email, (await api(a, 'files/root?fields=id')).id);
  return rootIds.get(a.email);
}
const samePath = (x, y) => x.length === y.length && x.every((n, i) => n === y[i]);
const isInside = (target, src) => target.length >= src.length && src.every((n, i) => n === target[i]);

// Moves files/folders into the merged folder at targetNames. Each item stays in its own account
// (instant, no extra space); the target folder is created in that account if it only exists elsewhere.
async function moveItems(its, targetNames) {
  { const why = await protectReason(its); if (why) return toast(why, true); }
  if (!searchQ) {
    const here = curNames();
    if (samePath(here, targetNames)) { toast('Already in this folder'); return; }
    const bad = its.find(it => it.kind === 'folder' && isInside(targetNames, [...here, it.name]));
    if (bad) { toast(`Can't move “${bad.name}” into itself`, true); return; }
  }
  const parts = its.flatMap(it => it.kind === 'folder'
    ? it.refs.map(r => ({ email: r.email, id: r.id, name: it.name }))
    : [{ email: it.email, id: it.id, parents: it.parents, name: it.name }]);
  toast(`Moving ${its.length} item${its.length > 1 ? 's' : ''}…`);
  const res = await Promise.allSettled(parts.map(async p => {
    const a = accBy(p.email);
    const target = targetNames.length ? await ensureFolderPath(a, targetNames) : await rootIdOf(a);
    let parents = p.parents;
    if (!parents) parents = (await api(a, `files/${p.id}?fields=parents`)).parents || [];
    if (parents.includes(target) || p.id === target) return;
    await api(a, `files/${p.id}?` + qs({ addParents: target, ...(parents.length ? { removeParents: parents.join(',') } : {}), fields: 'id' }), jsonOpts('PATCH', {}));
  }));
  const failed = res.filter(r => r.status === 'rejected');
  failed.forEach(r => console.warn(r.reason));
  if (failed.length) handleErr(failed[0].reason);
  else toast(`Moved to ${targetNames.length ? targetNames[targetNames.length - 1] : 'All files'}`);
  selected.clear(); fcache.clear(); reload();
}

let pstack = [];
function showMovePicker(its, save) {   // save = {title, onPick(names)}: pick a folder to save into instead of moving
  if (!its.length) return;
  pstack = searchQ || save ? [{ name: 'All files', refs: null }] : stack.map(s => ({ ...s }));
  const verb = save ? 'Save here' : 'Move here';
  showModal(`<h2>${save ? escH(save.title) : 'Move ' + (its.length === 1 ? '“' + escH(its[0].name) + '”' : its.length + ' items')}</h2>
    <p class="sub" style="margin:0">Pick a folder, then tap <b>${verb}</b>.</p>
    <nav class="crumbs picker-crumbs" id="pCrumbs"></nav>
    <div class="picker-list" id="pList"></div>
    <div class="right" style="justify-content:space-between">
      <button id="pNew">+ New folder</button>
      <span style="display:flex;gap:8px"><button data-close>Cancel</button><button class="primary" id="pMove">${verb}</button></span>
    </div>`, 'move');
  const pNames = () => pstack.slice(1).map(s => s.name);
  const blocked = () => {
    if (save) return '';
    const t = pNames();
    if (!searchQ && samePath(t, curNames())) return 'Already here';
    if (!searchQ && its.some(it => it.kind === 'folder' && isInside(t, [...curNames(), it.name]))) return "Can't move a folder into itself";
    return '';
  };
  let folders = [];
  const draw = async () => {
    $('#pCrumbs').innerHTML = pstack.map((s, i) => `<a data-pc="${i}">${escH(s.name)}</a>`).join('<span class="sep">›</span>');
    const why = blocked(); const mv = $('#pMove');
    mv.disabled = !!why; mv.title = why; mv.textContent = why || verb;
    const list = $('#pList'); list.innerHTML = '<div class="spinner"></div>';
    const loc = pstack[pstack.length - 1], refs = locRefs(loc), names = pNames();
    refs.forEach(r => seed(r.email, names, r.id));
    const res = await Promise.allSettled(refs.map(async r => ({
      email: r.email,
      items: (await api(accBy(r.email), 'files?' + qs({ q: `'${r.id}' in parents and mimeType='${FOLDER}' and trashed=false`, fields: 'files(id,name,mimeType,modifiedTime)', pageSize: 1000 }))).files
    })));
    if (!$('#pList')) return;
    folders = merge(res.filter(x => x.status === 'fulfilled').map(x => x.value))
      .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
    list.innerHTML = folders.length
      ? folders.map((f, i) => `<div class="row" data-pf="${i}"><span class="ic folder">${FOLDER_SVG}</span><div class="nm"><div class="t">${escH(f.name)}</div></div><span class="st">›</span></div>`).join('')
      : `<div class="empty" style="padding:40px 10px">No folders here. You can ${save ? 'save' : 'move'} into this folder or create a new one.</div>`;
  };
  $('#pList').onclick = e => { const r = e.target.closest('[data-pf]'); if (r) { const f = folders[+r.dataset.pf]; pstack.push({ name: f.name, refs: f.refs }); draw(); } };
  $('#pCrumbs').onclick = e => { const c = e.target.closest('[data-pc]'); if (c) { pstack = pstack.slice(0, +c.dataset.pc + 1); draw(); } };
  $('#pNew').onclick = async () => {
    const n = prompt('New folder name'); if (!n || !n.trim()) return;
    const refs = locRefs(pstack[pstack.length - 1]).map(r => accBy(r.email));
    const a = (refs.length ? refs : live()).slice().sort((x, y) => freeOf(y) - freeOf(x))[0];
    if (!a) return toast('Reconnect an account first', true);
    try { await ensureFolderPath(a, [...pNames(), n.trim()]); draw(); } catch (e) { handleErr(e); }
  };
  $('#pMove').onclick = () => { const t = pNames(); $('#modal').dataset.locked = ''; closeModal(); if (save) save.onPick(t); else moveItems(its, t); };
  draw();
}

/* drag rows onto folders or breadcrumbs (desktop) */
let dragItems = null;
const PD_TYPE = 'application/x-pooldrive';
$('#list').addEventListener('dragstart', e => {
  const row = e.target.closest('[data-i]'); if (!row) return;
  const it = view[+row.dataset.i];
  dragItems = selected.has(ikey(it)) ? [...selected.values()] : [it];
  e.dataTransfer.setData(PD_TYPE, '1'); e.dataTransfer.effectAllowed = 'move';
  const lbl = dragItems.length > 1 ? `${dragItems.length} items` : it.name;
  const ghost = document.createElement('div');
  ghost.textContent = lbl; ghost.style.cssText = 'position:absolute;top:-999px;padding:6px 12px;border-radius:8px;background:#4f46e5;color:#fff;font:600 13px system-ui';
  document.body.appendChild(ghost); e.dataTransfer.setDragImage(ghost, 10, 10); setTimeout(() => ghost.remove());
  requestAnimationFrame(() => document.querySelectorAll('#list [data-i]').forEach(r => { if (dragItems.includes(view[+r.dataset.i])) r.classList.add('dragging'); }));
});
$('#list').addEventListener('dragend', () => { dragItems = null; document.querySelectorAll('.dragging,.drop-on').forEach(x => x.classList.remove('dragging', 'drop-on')); });
function dropTarget(e) {
  if (!dragItems || searchQ) return null;
  const row = e.target.closest('#list [data-i]');
  if (row) { const it = view[+row.dataset.i]; if (it.kind === 'folder' && !dragItems.includes(it)) return { el: row, names: [...curNames(), it.name] }; return null; }
  const c = e.target.closest('#crumbs [data-c]');
  if (c && c.dataset.c !== 'clear' && +c.dataset.c < stack.length - 1) return { el: c, names: stack.slice(1, +c.dataset.c + 1).map(s => s.name) };
  return null;
}
document.addEventListener('dragover', e => {
  if (!dragItems) return;
  document.querySelectorAll('.drop-on').forEach(x => x.classList.remove('drop-on'));
  const t = dropTarget(e); if (!t) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move'; t.el.classList.add('drop-on');
});
document.addEventListener('drop', e => {
  if (!dragItems) return;
  const t = dropTarget(e); const its = dragItems; dragItems = null;
  document.querySelectorAll('.drop-on,.dragging').forEach(x => x.classList.remove('drop-on', 'dragging'));
  if (!t) return;
  e.preventDefault(); moveItems(its, t.names);
});

const ACC_COLORS = ['#4f46e5', '#0e9f8e', '#e8890c', '#c2417c', '#3e63dd', '#8e4ec6', '#18794e', '#d93f3f'];
const accColor = a => ACC_COLORS[accounts.indexOf(a) % ACC_COLORS.length];
function renderSpace() {
  const all = accounts;
  const unlimited = all.some(a => !a.limit);
  const total = all.reduce((s, a) => s + (a.limit || 0), 0);
  const used = all.reduce((s, a) => s + (a.usage || 0), 0);
  const free = unlimited ? Infinity : Math.max(0, total - used);
  const freeT = all.length ? fmt(free) : '—';
  const sub = all.length ? `${fmt(used)} used of ${unlimited ? 'unlimited' : fmt(total)} · ${all.length} account${all.length > 1 ? 's' : ''}` : 'No accounts yet';
  $('#freeTxt').textContent = freeT; $('#mFree').textContent = freeT;
  $('#totalTxt').textContent = sub; $('#mTotal').textContent = sub;
  const segs = total ? all.map(a => `<i style="width:${Math.min(100, (a.usage || 0) / total * 100)}%;background:${accColor(a)}" title="${escH(a.email)}: ${fmt(a.usage)} used"></i>`).join('') : '';
  $('#totalBar').innerHTML = segs; $('#mBar').innerHTML = segs;
  const SHOW = 3;     // keep the sidebar card small: the full list is in Accounts
  const shown = all.length > SHOW + 1 ? all.slice(0, SHOW) : all;
  $('#accList').innerHTML = shown.map(a => `<div class="acc-row"><span class="dot" style="background:${accColor(a)}"></span><span title="${escH(a.email)}">${escH(a.email.split('@')[0])}${isLive(a) ? '' : ' ⚠'}</span><span class="f">${fmt(freeOf(a))}</span></div>`).join('') +
    (all.length > shown.length ? `<button class="ghost acc-more" style="padding:2px 0;font-size:12.5px;color:var(--accent);text-align:left">+ ${all.length - shown.length} more account${all.length - shown.length > 1 ? 's' : ''}</button>` : '');
}

// No banner: a red dot on Accounts + the reconnect box pops up by itself when sign-ins expire.
function updateBanner() {
  $('#banner').classList.add('hidden');
  const dead = cfg.clientId ? accounts.filter(a => !isLive(a)) : [];
  document.querySelectorAll('.acc-btn').forEach(b => {
    b.classList.toggle('alert', dead.length > 0);
    b.title = dead.length ? `${dead.length} account${dead.length > 1 ? 's need' : ' needs'} reconnecting` : '';
  });
  if (!dead.length) { if ($('#modal').dataset.view === 'reconnect') closeModal(); return; }
  const m = $('#modal');
  if (m.dataset.view === 'reconnect') return showReconnectBox();          // keep the list up to date
  if (!reconnectLater && m.classList.contains('hidden')) showReconnectBox();
}

/* ---------------- Modals ---------------- */
function showModal(html, viewName, opts = {}) {
  const m = $('#modal'), s = $('#sheet');
  s.className = 'sheet' + (opts.wide ? ' wide' : '');
  s.innerHTML = html; m.dataset.view = viewName; m.dataset.locked = opts.locked ? '1' : '';
  m.classList.remove('hidden');
}
function closeModal() {
  const m = $('#modal'); if (m.dataset.locked) return;
  m.classList.add('hidden'); m.dataset.view = '';
  const s = $('#sheet'); s.querySelectorAll('[data-url]').forEach(x => URL.revokeObjectURL(x.dataset.url)); s.innerHTML = '';
}

/* ---------------- Analysis: large, duplicate, old files, empty folders ----------------
   One scan lists every file you own in every account, then everything is worked out here. */
let scan = null, scanning = false, scanCount = 0, anaTab = 'large';
const anaSel = new Set();
const LARGE_MIN = 25 * 1024 * 1024;              // "large" = 25 MB or more
const OLD_MS = 2 * 365 * 24 * 3600 * 1000;       // "old" = not changed in 2 years
const TYPE_DEFS = [
  ['PDFs', '#d93f3f'], ['Images', '#2f8f57'], ['Spreadsheets', '#18794e'], ['Documents', '#3e63dd'],
  ['Videos', '#8e4ec6'], ['Audio', '#d6409f'], ['Archives', '#6f6e77'], ['Other', '#a1a1aa']];
function typeGroup(f) {
  const t = typeOf(f)[0];
  return { pdf: 'PDFs', image: 'Images', sheet: 'Spreadsheets', doc: 'Documents', slides: 'Documents', text: 'Documents',
           video: 'Videos', audio: 'Audio', zip: 'Archives' }[t] || 'Other';
}

async function runScan() {
  if (scanning) return;
  scanning = true; scanCount = 0; anaSel.clear(); renderAnalysis();
  const all = [];
  try {
    await Promise.all(live().map(async a => {
      let tok;
      do {
        const p = { q: "trashed=false and 'me' in owners", pageSize: 1000,
          fields: 'nextPageToken,files(id,name,mimeType,size,modifiedTime,parents,md5Checksum,appProperties,webViewLink)' };
        if (tok) p.pageToken = tok;
        const r = await api(a, 'files?' + qs(p));
        r.files.forEach(f => all.push({ ...f, email: a.email }));
        scanCount = all.length; tok = r.nextPageToken;
        if (mode === 'analysis') renderAnalysis();
      } while (tok);
    }));
  } catch (e) { scanning = false; handleErr(e); renderAnalysis(); return; }

  // folders → paths and lock status
  const folders = new Map(), hasChild = new Set();
  all.forEach(f => {
    if (f.mimeType === FOLDER) folders.set(f.email + '/' + f.id, f);
    (f.parents || []).forEach(p => hasChild.add(f.email + '/' + p));
  });
  const pathMemo = new Map();
  const chain = (email, id) => {                       // [{name, locked}] from top to this folder
    const k = email + '/' + id;
    if (pathMemo.has(k)) return pathMemo.get(k);
    const f = folders.get(k); let out = [];
    if (f) out = [...((f.parents || [])[0] ? chain(email, f.parents[0]) : []), { name: f.name, id: f.id, locked: isLockedF(f) }];
    pathMemo.set(k, out); return out;
  };
  const enrich = f => {
    const c = (f.parents || [])[0] ? chain(f.email, f.parents[0]) : [];
    const lockedUp = [...c].reverse().find(x => x.locked);
    return { ...f, kind: f.mimeType === FOLDER ? 'folder' : 'file', pathNames: c.map(x => x.name), pathChain: c, path: c.map(x => x.name).join(' › ') || 'All files',
             lockedAboveName: lockedUp ? lockedUp.name : '' };
  };

  const files = all.filter(f => f.mimeType !== FOLDER && f.size).map(enrich);
  const now = Date.now();
  const types = new Map(TYPE_DEFS.map(([n]) => [n, 0]));
  files.forEach(f => types.set(typeGroup(f), types.get(typeGroup(f)) + (+f.size)));
  const usedBytes = files.reduce((s, f) => s + (+f.size), 0);

  const groups = new Map();
  files.forEach(f => {
    const k = f.md5Checksum ? 'm' + f.md5Checksum + f.size : 'n' + f.name + '|' + f.size;
    if (!groups.has(k)) groups.set(k, []); groups.get(k).push(f);
  });
  const dups = [...groups.values()].filter(g => g.length > 1)
    .map(g => g.sort((a, b) => (b.modifiedTime || '').localeCompare(a.modifiedTime || '')))
    .map(g => ({ name: g[0].name, size: +g[0].size, items: g, wasted: (+g[0].size) * (g.length - 1) }))
    .sort((a, b) => b.wasted - a.wasted);

  const empty = all.filter(f => f.mimeType === FOLDER && !hasChild.has(f.email + '/' + f.id))
    .map(f => { const e = enrich(f); return { ...e, refs: [{ email: f.email, id: f.id }], locked: isLockedF(f) }; });

  scan = {
    when: new Date(), total: all.length, usedBytes, scanned: live().map(a => a.email),
    types: TYPE_DEFS.map(([n, c]) => ({ name: n, color: c, bytes: types.get(n) })).filter(t => t.bytes > 0),
    large: files.slice().sort((a, b) => b.size - a.size).slice(0, 100),
    largeCount: files.filter(f => +f.size >= LARGE_MIN).length,
    dups: dups.slice(0, 150), dupCount: dups.length, dupWaste: dups.reduce((s, g) => s + g.wasted, 0),
    old: files.filter(f => f.modifiedTime && now - Date.parse(f.modifiedTime) > OLD_MS)
      .sort((a, b) => (a.modifiedTime || '').localeCompare(b.modifiedTime || '')),
    empty
  };
  scanning = false;
  if (mode === 'analysis') renderAnalysis();
}

function anaList() {
  if (!scan) return [];
  return anaTab === 'large' ? scan.large : anaTab === 'old' ? scan.old.slice(0, 300) : anaTab === 'empty' ? scan.empty.slice(0, 300) : [];
}

function renderAnalysis() {
  const el = $('#list');
  if (!live().length) { el.innerHTML = '<div class="list empty"><h3>No connected accounts</h3><p>Reconnect your accounts to analyse them.</p></div>'; return; }
  if (!scan && !scanning) { runScan(); return; }
  if (scanning && !scan) {
    el.innerHTML = `<div class="card progress"><div class="spinner" style="margin:0 auto 14px"></div>Scanning ${live().length} account${live().length > 1 ? 's' : ''}… <b>${scanCount.toLocaleString()}</b> items found</div>`;
    return;
  }
  const S = scan;
  const missing = accounts.filter(a => !S.scanned.includes(a.email));
  const tabs = [
    ['large', 'Large files', S.largeCount.toLocaleString(), 'Over 25 MB each'],
    ['dup', 'Duplicates', S.dupCount.toLocaleString() + ' group' + (S.dupCount === 1 ? '' : 's'), fmt(S.dupWaste) + ' wasted'],
    ['old', 'Old files', S.old.length.toLocaleString(), 'Not changed in 2+ years'],
    ['empty', 'Empty folders', S.empty.length.toLocaleString(), 'Nothing inside']];
  const panels = {
    large: ['Largest files', 'Biggest first (top 100). Tick the ones you no longer need.', 'Trash selected'],
    dup: ['Duplicates', 'Same file in more than one place, in any account. The newest copy is kept.', 'Keep newest of all'],
    old: ['Old files', 'Oldest first. Review before deleting.', 'Trash selected'],
    empty: ['Empty folders', 'Folders with nothing inside.', 'Remove selected'] };
  const [pt, ph, pa] = panels[anaTab];
  const list = anaList();
  const selCount = anaSel.size;
  const maxSize = Math.max(1, ...(anaTab === 'large' ? list.map(f => +f.size) : [1]));
  const lockTag = f => f.lockedAboveName ? ` <span class="lock" title="Inside locked folder ${escH(f.lockedAboveName)}">🔒</span>` : '';
  const fileRow = (f, i, right) => {
    const [, label, color] = typeOf(f);
    const icon = f.kind === 'folder' ? `<span class="ic folder" style="width:34px;height:34px">${FOLDER_SVG.replace('34', '30').replace('34', '30')}</span>` : `<span class="ic" style="--c:${color}">${label}</span>`;
    return `<div class="arow"><input type="checkbox" data-asel="${i}" ${anaSel.has(i) ? 'checked' : ''} aria-label="Select ${escH(f.name)}">
      <span class="nmx">${icon}<a data-aopen="${i}" title="${escH(f.name)}">${escH(f.name)}</a>${lockTag(f)}</span>
      <span class="path" title="${escH(f.path)}">${escH(f.path)}</span>${right}</div>`;
  };
  let body = '';
  if (anaTab === 'dup') {
    body = S.dups.length ? S.dups.map((g, gi) => {
      const [, label, color] = typeOf(g.items[0]);
      return `<div class="dgroup"><div class="h"><span class="ic" style="--c:${color}">${label}</span><span class="n" title="${escH(g.name)}">${escH(g.name)}</span>
        <span class="m">${g.items.length} copies · ${fmt(g.size)} each</span>
        <button data-adup="${gi}">Keep newest, trash others</button></div>
        <div class="places">${g.items.map((f, k) => `<span>${k === 0 ? '<b>Keep ·</b> ' : ''}${escH(f.path)} · ${escH(f.email.split('@')[0])} · ${fmtDate(f.modifiedTime)}${lockTag(f)}</span>`).join('')}</div></div>`;
    }).join('') : '<div class="empty"><h3>No duplicates found 🎉</h3></div>';
  } else if (!list.length) {
    body = `<div class="empty"><h3>Nothing here 🎉</h3></div>`;
  } else {
    body = list.map((f, i) => fileRow(f, i,

function purgeFromScan(its) {
  if (!scan) return;
  const gone = new Set(its.map(f => f.email + '/' + f.id));
  const keep = f => !gone.has(f.email + '/' + f.id);
  scan.large = scan.large.filter(keep); scan.old = scan.old.filter(keep); scan.empty = scan.empty.filter(keep);
  scan.dups = scan.dups.map(g => ({ ...g, items: g.items.filter(keep) })).filter(g => g.items.length > 1)
    .map(g => ({ ...g, wasted: g.size * (g.items.length - 1) }));
  scan.dupCount = scan.dups.length; scan.dupWaste = scan.dups.reduce((s, g) => s + g.wasted, 0);
  scan.largeCount = scan.large.filter(f => +f.size >= LARGE_MIN).length;
  anaSel.clear();
}
async function anaTrash(its) {
  if (!its.length) return;
  const ok = await deleteItems(its);
  if (ok) { purgeFromScan(its); renderAnalysis(); }
}

async function openFile(f) {
  const [t] = typeOf(f);
  const native = (f.mimeType || '').startsWith('application/vnd.google-apps.');
  if (native || t === 'video' || t === 'audio' || (t === 'pdf' && isTouch)) { window.open(driveLink(f), '_blank', 'noopener'); return; }
  // Word, Excel, PowerPoint, zip and everything else: open in Google Drive's online viewer (Download stays in the ⋯ menu)
  if (!['image', 'pdf', 'text'].includes(t)) { window.open(driveLink(f), '_blank', 'noopener'); return; }
  showModal(`<div class="sheet-head"><div class="t">${escH(f.name)}</div>

  } catch (e) { closeModal(); handleErr(e); }
}

async function downloadFile(f) {
  if ((f.mimeType || '').startsWith('application/vnd.google-apps.')) { window.open(driveLink(f), '_blank', 'noopener'); return; }
  toast('Downloading ' + f.name + '…');
  try {

    const a = document.createElement('a'); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { handleErr(e); }
}

/* ---------------- Folder lock ----------------
   Saved on the folder in Google Drive (appProperties), so it applies on every device.
   Locked folder: can't be trashed, renamed or moved. Anything inside it: can't be trashed. */
async function lockedAncestor(it) {           // name of a locked folder above this item, or ''
  const a = accBy(it.email); if (!a) return '';
  let cur = (it.parents || [])[0];
  for (let i = 0; i < 40 && cur; i++) {
    const f = await api(a, `files/${cur}?fields=name,parents,appProperties`);
    if (isLockedF(f)) return f.name;
    cur = (f.parents || [])[0];
  }
  return '';
}
// Locked folder itself: blocked. Returns a reason string, or ''.
async function protectReason(its) {
  const lockedSelf = its.find(it => it.kind === 'folder' && it.locked);
  return lockedSelf ? `“${lockedSelf.name}” is locked. Unlock it first (⋯ → Unlock folder).` : '';
}
// Name of the locked folder these items sit inside (deleting them needs an extra confirmation), or ''.
async function insideLocked(its) {
  const pre = its.find(it => it.lockedAboveName);
  if (pre) return pre.lockedAboveName;
  if (its.every(it => 'lockedAboveName' in it)) return '';
  if (mode === 'files' && !searchQ) return stack.find(s => s.locked)?.name || '';
  for (const it of its) { try { const n = await lockedAncestor(it); if (n) return n; } catch {} }
  return '';
}
async function setLock(it, on) {
  if (!on && !confirm(`Unlock “${it.name}”?\n\nIt and everything inside can then be deleted, renamed or moved again.`)) return;
  const missing = it.refs.filter(r => !isLive(accBy(r.email)));

  try {
    await Promise.all(it.refs.map(r => api(accBy(r.email), `files/${r.id}?fields=id`,

  } catch (e) { handleErr(e); }
}
