/* ---------------- Smart upload ---------------- */
let jobs = [], jobSeq = 0, running = 0, panelOpen = true;

// Decide which account gets each file. Folders stay in one account when they fit.
function planUpload(entries) {
  const base = curNames();
  const accs = live();
  const free = new Map(accs.map(a => [a.email, freeOf(a)]));
  const here = new Set(locRefs(stack[stack.length - 1]).map(r => r.email));
  const size = u => u.reduce((s, e) => s + e.file.size, 0);
  const groups = new Map(), units = [];
  for (const e of entries) {
    if (e.dirs.length) { const k = e.dirs[0]; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); }
    else units.push([e]);
  }
  groups.forEach(g => units.push(g));
  units.sort((a, b) => size(b) - size(a));
  const pick = need => {
    let c = accs.filter(a => free.get(a.email) >= need + MARGIN);
    if (!c.length) return null;
    if (cfg.keepTogether) { const p = c.filter(a => here.has(a.email)); if (p.length) c = p; }
    return c.sort((a, b) => free.get(b.email) - free.get(a.email))[0];
  };
  const planned = [], tooBig = [];
  const queue = units.slice();
  while (queue.length) {
    const u = queue.shift(), need = size(u), a = pick(need);
    if (a) {
      free.set(a.email, free.get(a.email) - need);
      u.forEach(e => planned.push({ file: e.file, name: e.name || e.file.name, acc: a, path: [...base, ...e.dirs] }));
    } else if (u.length > 1) {
      u.forEach(e => queue.push([e]));            // folder too big for one account: spread its files
      queue.sort((x, y) => size(y) - size(x));
    } else tooBig.push(u[0].file);
  }
  return { planned, tooBig };
}

/* ---- same-name check: Replace / Keep both / Skip ---- */
// Find a folder by names without creating anything. Returns id or null.
async function lookupFolder(a, names) {
  if (!names.length) return 'root';
  const k = fkey(a.email, names);
  if (fcache.has(k)) { try { return await fcache.get(k); } catch {} }
  const parent = await lookupFolder(a, names.slice(0, -1));
  if (!parent) return null;
  const r = await api(a, 'files?' + qs({ q: `name='${escQ(names[names.length - 1])}' and '${parent}' in parents and mimeType='${FOLDER}' and trashed=false`, fields: 'files(id)', pageSize: 1 }));
  if (!r.files.length) return null;
  fcache.set(k, Promise.resolve(r.files[0].id));
  return r.files[0].id;
}

async function findConflicts(entries) {
  const base = curNames(), byPath = new Map();
  for (const e of entries) {
    const path = [...base, ...e.dirs], k = path.join('/');
    if (!byPath.has(k)) byPath.set(k, { path, list: [] });
    byPath.get(k).list.push(e);
  }
  const out = [], groups = [...byPath.values()];
  for (let g = 0; g < groups.length; g += 5) {                 // 5 folders at a time
    await Promise.all(groups.slice(g, g + 5).map(async ({ path, list }) => {
      const existing = new Map(), names = new Set();
      await Promise.all(live().map(async a => {
        try {
          const id = await lookupFolder(a, path); if (!id) return;
          for (const f of await listChildren(a, id)) {
            names.add(f.name);
            if (f.mimeType !== FOLDER && !existing.has(f.name)) existing.set(f.name, { ...f, email: a.email });
          }
        } catch {}
      }));
      for (const e of list) {
        e.taken = names;
        const ex = existing.get(e.file.name);
        if (ex) out.push({ e, ex, path });
      }
    }));
  }
  return out;
}

function askConflicts(conflicts) {
  return new Promise(resolve => {
    const dec = new Map(); let i = 0;
    const sheet = $('#sheet');
    const show = () => {
      if (i >= conflicts.length) { sheet.onclick = null; $('#modal').dataset.locked = ''; closeModal(); return resolve(dec); }
      const { e, ex, path } = conflicts[i], left = conflicts.length - i;
      const native = (ex.mimeType || '').startsWith('application/vnd.google-apps.');
      showModal(`<h2>File already exists</h2>
        <p class="sub">“<b>${escH(e.file.name)}</b>” is already in <b>${escH(path.length ? path.join(' / ') : 'All files')}</b>.${left > 1 ? ` (${left} conflicts left)` : ''}</p>
        <div class="info-row"><b>Existing</b><span>${ex.size ? fmt(+ex.size) : 'Google file'} · ${escH(fmtDate(ex.modifiedTime))}</span></div>
        <div class="info-row"><b>New</b><span>${fmt(e.file.size)} · ${escH(fmtDate(e.file.lastModified))}</span></div>
        ${left > 1 ? `<label class="check"><input type="checkbox" id="cfAll"><span>Do this for all ${left} conflicts</span></label>` : ''}
        <div class="right"><button data-cf="skip">Skip</button><button data-cf="keep">Keep both</button><button class="primary" data-cf="replace" ${native ? 'disabled title="Google Docs/Sheets can\'t be replaced by an upload"' : ''}>Replace</button></div>
        <div class="note">Replace keeps the old version in Google Drive's version history for 30 days.</div>`, 'conflict', { locked: true });
      sheet.onclick = ev => {
        const c = ev.target.closest('[data-cf]')?.dataset.cf; if (!c) return;
        if ($('#cfAll')?.checked) { for (; i < conflicts.length; i++) dec.set(conflicts[i].e, c === 'replace' && (conflicts[i].ex.mimeType || '').startsWith('application/vnd.google-apps.') ? 'keep' : c); }
        else { dec.set(conflicts[i].e, c); i++; }
        show();
      };
    };
    show();
  });
}

function uniqueName(name, taken) {
  const dot = name.lastIndexOf('.'), stem = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : '';
  for (let n = 1; ; n++) { const c = `${stem} (${n})${ext}`; if (!taken.has(c)) { taken.add(c); return c; } }
}

async function startUpload(entries) {
  entries = entries.filter(e => e.file);
  if (!entries.length) return;
  if (!live().length) return toast(accounts.length ? 'Reconnect an account first' : 'Add a Google account first', true);
  if (searchQ || mode !== 'files') { clearSearch(); mode = 'files'; document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === 'files')); reload(); }

  if (entries.length > 20) toast('Checking for files that already exist…');
  const conflicts = await findConflicts(entries);
  const replaceJobs = [];
  if (conflicts.length) {
    const dec = await askConflicts(conflicts);
    const exOf = new Map(conflicts.map(c => [c.e, c.ex]));
    entries = entries.filter(e => {
      const d = dec.get(e); if (!d) return true;
      if (d === 'skip') return false;
      if (d === 'keep') { e.name = uniqueName(e.file.name, e.taken); return true; }
      const ex = exOf.get(e);
      replaceJobs.push({ file: e.file, name: ex.name, acc: accBy(ex.email), path: [...curNames(), ...e.dirs], replaceId: ex.id, oldSize: +ex.size || 0 });
      return false;
    });
  }
  const { planned, tooBig } = entries.length ? planUpload(entries) : { planned: [], tooBig: [] };
  planned.push(...replaceJobs);
  if (!planned.length && !tooBig.length) return toast('Nothing to upload');
  if (tooBig.length) {
    const most = Math.max(...live().map(freeOf));
    const list = tooBig.slice(0, 6).map(f => `• ${f.name} (${fmt(f.size)})`).join('\n') + (tooBig.length > 6 ? `\n…and ${tooBig.length - 6} more` : '');
    const msg = `${tooBig.length} file${tooBig.length > 1 ? 's are' : ' is'} too big for any single account.\nMost free space in one account: ${fmt(most)}\n\n${list}`;
    if (!planned.length) { alert(msg); return; }
    if (!confirm(msg + `\n\nUpload the other ${planned.length} file${planned.length > 1 ? 's' : ''}?`)) return;
  }
  if (jobs.length && jobs.every(j => j.status === 'done' || j.status === 'error')) jobs = [];
  planned.forEach(p => jobs.push({ ...p, id: ++jobSeq, loaded: 0, status: 'waiting' }));
  panelOpen = true; renderUploads(); pump();
}

function pump() {
  while (running < PARALLEL) {
    const j = jobs.find(x => x.status === 'waiting');
    if (!j) break;
    running++;
    runJob(j).finally(() => {
      running--;
      if (!jobs.some(x => x.status === 'waiting' || x.status === 'uploading')) batchDone();
      pump();
    });
  }
}

async function runJob(j) {
  j.status = 'uploading'; renderUploads();
  try {
    const parent = j.replaceId ? null : await ensureFolderPath(j.acc, j.path);
    await uploadFile(j.acc, j.file, parent, l => { j.loaded = l; scheduleUploadsRender(); }, j.name, j.replaceId);
    j.loaded = j.file.size; j.status = 'done';
    j.acc.usage += j.file.size - (j.oldSize || 0); saveAcc(); renderSpace();
  } catch (e) { j.status = 'error'; j.err = e instanceof AuthErr ? 'Sign-in expired. Reconnect and retry.' : e.message; }
  renderUploads();
}

async function uploadFile(a, file, parentId, onProgress, name, replaceId) {
  if (!isLive(a) && !(await silentRefresh(a))) throw new AuthErr(a);
  const type = file.type || 'application/octet-stream';
  const meta = replaceId ? {} : { name: name || file.name, parents: [parentId] };
  const url = replaceId ? `${UPLOAD}/${replaceId}` : UPLOAD, method = replaceId ? 'PATCH' : 'POST';
  const init = await fetch(url + '?uploadType=resumable&fields=id', {
    method,
    headers: { Authorization: 'Bearer ' + a.token, 'Content-Type': 'application/json; charset=UTF-8', 'X-Upload-Content-Type': type },
    body: JSON.stringify(meta)
  });
  if (init.status === 401) { a.exp = 0; saveAcc(); updateBanner(); throw new AuthErr(a); }
  if (!init.ok) { let m = 'Upload failed (' + init.status + ')'; try { m = (await init.json()).error?.message || m; } catch {} throw new Error(m); }
  const session = init.headers.get('Location');
  if (session) return sendXHR('PUT', session, file, { 'Content-Type': type }, onProgress);
  // Fallback if the browser hides the session URL: one-shot multipart upload
  const b = 'pooldrive' + Math.random().toString(36).slice(2);
  const body = new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${type}\r\n\r\n`, file, `\r\n--${b}--`]);
  return sendXHR(method, url + '?uploadType=multipart&fields=id', body,
    { Authorization: 'Bearer ' + a.token, 'Content-Type': 'multipart/related; boundary=' + b }, l => onProgress(Math.min(l, file.size)));
}

function sendXHR(method, url, body, headers, onProgress) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open(method, url);
    Object.entries(headers).forEach(([k, v]) => x.setRequestHeader(k, v));
    x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded); };
    x.onload = () => x.status < 300 ? res(x.responseText) : rej(new Error('Upload failed (' + x.status + ')'));
    x.onerror = () => rej(new Error('Network error. Check your connection.'));
    x.send(body);
  });
}

async function batchDone() {
  await Promise.allSettled(live().map(refreshAbout));
  saveAcc(); renderSpace(); fcache.clear(); reload();
  const done = jobs.filter(j => j.status === 'done').length, bad = jobs.filter(j => j.status === 'error').length;
  toast(bad ? `${done} uploaded, ${bad} failed` : `${done} file${done > 1 ? 's' : ''} uploaded`, !!bad);
}

let uploadsRaf = 0;
function scheduleUploadsRender() { if (!uploadsRaf) uploadsRaf = requestAnimationFrame(() => { uploadsRaf = 0; renderUploads(); }); }
function renderUploads() {
  const el = $('#uploads');
  if (!jobs.length) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const total = jobs.reduce((s, j) => s + j.file.size, 0) || 1;
  const loaded = jobs.reduce((s, j) => s + (j.status === 'error' ? j.file.size : j.loaded), 0);
  const done = jobs.filter(j => j.status === 'done').length, bad = jobs.filter(j => j.status === 'error').length;
  const finished = done + bad === jobs.length;
  const pct = Math.round(loaded / total * 100);
  const title = finished ? (bad ? `${done} uploaded · ${bad} failed` : `${done} upload${done > 1 ? 's' : ''} complete`) : `Uploading ${done + 1 > jobs.length ? jobs.length : done + 1} of ${jobs.length} · ${pct}%`;
  el.innerHTML = `<div class="up-head" style="position:relative"><span>${title}</span>
      ${bad && finished ? '<button class="ghost" id="upRetry" style="padding:4px 8px">Retry</button>' : ''}
      <button class="ghost" id="upToggle" style="padding:4px 8px">${panelOpen ? '▾' : '▴'}</button>
      ${finished ? '<button class="ghost" id="upClose" style="padding:4px 8px">✕</button>' : ''}
      <div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="up-list ${panelOpen ? '' : 'hidden'}">${jobs.slice().reverse().map(j => {
      const p = j.file.size ? Math.round(j.loaded / j.file.size * 100) : 100;
      const st = j.status === 'done' ? '<span class="st ok">✓</span>' : j.status === 'error' ? '<span class="st err">Failed</span>'
        : j.status === 'uploading' ? `<span class="st">${p}%</span>` : '<span class="st">Waiting</span>';
      const sub = j.status === 'error' ? j.err : `${fmt(j.file.size)}${j.path.length ? ' · ' + j.path.join(' / ') : ''}`;
      return `<div class="up-item"><div class="nm"><div class="t">${escH(j.name || j.file.name)}${j.replaceId ? ' <span class="chip">replace</span>' : ''}</div><div class="s">${escH(sub)}</div></div>${st}</div>`;
    }).join('')}</div>`;
  $('#upToggle').onclick = () => { panelOpen = !panelOpen; renderUploads(); };
  const c = $('#upClose'); if (c) c.onclick = () => { jobs = []; renderUploads(); };
  const r = $('#upRetry'); if (r) r.onclick = () => {
    // retry into the same folders; switch account only if the old one is signed out or full
    jobs.filter(j => j.status === 'error').forEach(j => {
      if (!isLive(j.acc) || freeOf(j.acc) < j.file.size + MARGIN) {
        const alt = live().filter(a => freeOf(a) >= j.file.size + MARGIN).sort((a, b) => freeOf(b) - freeOf(a))[0];
        if (alt) j.acc = alt;
      }
      j.status = 'waiting'; j.loaded = 0; j.err = '';
    });
    renderUploads(); pump();
  };
}

/* ---------------- Drag & drop / pickers ---------------- */
async function collectDrop(dt) {
  const entries = [...dt.items].filter(i => i.kind === 'file').map(i => i.webkitGetAsEntry ? i.webkitGetAsEntry() : null);
  const plain = [...dt.files];
  if (!entries.length || entries.every(e => !e)) return plain.map(f => ({ file: f, dirs: [] }));
  const out = [];
  const walk = async (en, dirs) => {
    if (en.isFile) out.push({ file: await new Promise((r, j) => en.file(r, j)), dirs });
    else if (en.isDirectory) {
      const rd = en.createReader(); let batch;
      do {
        batch = await new Promise((r, j) => rd.readEntries(r, j));
        for (const c of batch) await walk(c, [...dirs, en.name]);
      } while (batch.length);
    }
  };
  await Promise.all(entries.filter(Boolean).map(e => walk(e, [])));
  return out;
}

let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $('#drop').classList.remove('hidden'); });
addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener('dragleave', e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $('#drop').classList.add('hidden'); } });
addEventListener('drop', async e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $('#drop').classList.add('hidden');
  startUpload(await collectDrop(e.dataTransfer));
});

$('#fileInput').onchange = e => { startUpload([...e.target.files].map(f => ({ file: f, dirs: [] }))); e.target.value = ''; };
$('#folderInput').onchange = e => {
  startUpload([...e.target.files].map(f => {
    const parts = (f.webkitRelativePath || f.name).split('/'); parts.pop();
    return { file: f, dirs: parts };
  }));
  e.target.value = '';
};

/* ---------------- Events ---------------- */
$('#list').addEventListener('click', e => {
  const sel = e.target.closest('[data-sel]');
  if (sel) { e.stopPropagation(); return toggleSel(view[+sel.dataset.sel]); }
  const more = e.target.closest('[data-more]');
  if (more) { e.stopPropagation(); return openMenu(view[+more.dataset.more], more); }
  const row = e.target.closest('[data-i]');
  if (!row) return;
  if (selected.size) return toggleSel(view[+row.dataset.i]);   // while selecting, a tap selects
  openItem(view[+row.dataset.i]);
});
$('#list').addEventListener('contextmenu', e => {
  const row = e.target.closest('[data-i]'); if (!row) return;
  e.preventDefault(); openMenu(view[+row.dataset.i], row.querySelector('.more'));
});
$('#crumbs').addEventListener('click', e => {
  const more = e.target.closest('[data-cm]');
  if (more) { e.stopPropagation(); return crumbMenu(more); }
  const c = e.target.closest('[data-c]')?.dataset.c; if (c == null) return;
  if (c === 'clear') { clearSearch(); return reload(); }
  stack = stack.slice(0, +c + 1); reload();
});
let searchTimer;
$('#search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQ = e.target.value.trim();
    if (searchQ && mode === 'analysis') { mode = 'files'; document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === 'files')); }
    reload();
  }, 350);
});
$('#sort').value = cfg.sort;
$('#sort').onchange = e => { cfg.sort = e.target.value; saveCfg(); renderList(); };
$('#btnUpload').onclick = e => { e.stopPropagation(); uploadMenu(e.currentTarget); };
$('#fabUpload').onclick = e => { e.stopPropagation(); uploadMenu(e.currentTarget); };
$('#mNewFolder').onclick = newFolder;
$('#mAccounts').onclick = showAccounts;
$('#accList').addEventListener('click', e => { if (e.target.closest('.acc-more')) showAccounts(); });
document.querySelectorAll('[data-nav]').forEach(b => b.onclick = e => { e.stopPropagation(); setMode(b.dataset.nav); });
if (!cfg.view) cfg.view = 'grid';
const syncView = () => { $('#vGrid').classList.toggle('on', cfg.view === 'grid'); $('#vList').classList.toggle('on', cfg.view === 'list'); };
syncView();
$('#vGrid').onclick = () => { cfg.view = 'grid'; saveCfg(); syncView(); renderList(); };
$('#vList').onclick = () => { cfg.view = 'list'; saveCfg(); syncView(); renderList(); };
$('#btnNewFolder').onclick = newFolder;
$('#btnAccounts').onclick = showAccounts;
$('#modal').addEventListener('click', e => {
  if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal();
  const rem = e.target.closest('[data-remove]'); if (rem) removeAccount(accounts[+rem.dataset.remove]);
});
document.addEventListener('click', e => {
  const rc = e.target.closest('[data-recon]'); if (rc) reconnect(accBy(rc.dataset.recon));
  if (e.target.closest('[data-reconall]')) reconnectAll();
  if (!e.target.closest('#menu')) closeMenu();
});
addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); if (!$('#modal').classList.contains('hidden')) closeModal(); else if (selected.size) clearSel(); } });
addEventListener('resize', closeMenu);
addEventListener('scroll', closeMenu, true);
addEventListener('beforeunload', e => { if (jobs.some(j => j.status === 'uploading' || j.status === 'waiting')) { e.preventDefault(); e.returnValue = ''; } });
// re-check sign-in state every minute (tokens last ~1 hour)
setInterval(async () => { try { if (await refreshAll()) renderSpace(); } catch {} updateBanner(); if ($('#modal').dataset.view === 'accounts') showAccounts(); }, 60000);

function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 3000);
}

/* ---------------- Start ---------------- */
const setHH = () => document.documentElement.style.setProperty('--hh', ($('.mobile-top').offsetHeight || 0) + 'px');
setHH(); addEventListener('resize', setHH);
renderSpace();
(async () => { try { await refreshAll(); } catch {} renderSpace(); updateBanner(); reload(); })();
if (!cfg.clientId) showSetup();

/* ---------------- App install + "Share → PoolDrive" from other apps ---------------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
async function takeShared() {   // files the service worker received from the phone's Share menu
  const d = await new Promise((ok, bad) => { const r = indexedDB.open('pooldrive-share', 1); r.onupgradeneeded = () => r.result.createObjectStore('inbox'); r.onsuccess = () => ok(r.result); r.onerror = () => bad(r.error); });
  return new Promise(ok => { const t = d.transaction('inbox', 'readwrite'), st = t.objectStore('inbox'), g = st.get('pending');
    g.onsuccess = () => { st.delete('pending'); ok(g.result || null); }; g.onerror = () => ok(null); });
}
async function receiveShare() {
  history.replaceState(null, '', location.pathname);
  const sh = await takeShared().catch(() => null);
  if (!sh) return;
  const files = (sh.files || []).slice();
  if (!files.length) {   // a link or text was shared: keep it as a small text file
    const body = [sh.title, sh.text, sh.url].filter(Boolean).join('\n');
    if (!body.trim()) return toast('Nothing to save', true);
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const nm = (sh.url || /^https?:\/\//.test(sh.text) ? 'Link ' : 'Note ') + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + '.' + p(d.getMinutes()) + '.txt';
    files.push(new File([body], nm, { type: 'text/plain' }));
  }
  const ask = () => {
    if (!cfg.clientId || !accounts.length) return toast('Add a Google account in PoolDrive first', true);
    if (!live().length) { toast('Reconnect your accounts, then share again', true); return showReconnectBox && showReconnectBox(); }
    showMovePicker(files.map(f => ({ name: f.name })), {
      title: files.length === 1 ? 'Save “' + files[0].name + '” to PoolDrive' : 'Save ' + files.length + ' files to PoolDrive',
      onPick: async names => { await navigateNames(names); startUpload(files.map(f => ({ file: f, dirs: [] }))); }
    });
  };
  try { await refreshAll(); } catch {}
  ask();
}
if (/[?&]share=1/.test(location.search)) receiveShare();
